<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>Update Form</title><link rel="icon" href="./icon.svg"><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f7fb;color:#292637;margin:0;min-height:100vh;display:grid;place-items:center}main{margin:24px;padding:32px;max-width:480px;border:1px solid #e8e4f2;border-radius:18px;background:white}h1{font-size:28px;letter-spacing:-.8px;line-height:1.25}p{color:#787587}button{font:600 16px system-ui,sans-serif;color:white;background:#6554df;border:0;border-radius:9px;padding:14px 20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #b7a9ef;outline-offset:4px}#status{font-size:14px}small{display:block;color:#8f8a9d;margin-top:24px}</style></head>
<body><main><h1>Get the latest Form.</h1><p>Install the update with clearer sign-in messages and resend protection.</p><p>Save any programme edits in other Form tabs before continuing. Your saved workouts stay in this browser.</p><button id="update">Update and open Form</button><p id="status" role="status" aria-live="polite"></p><small>This updates the app files. It does not clear browser data or remove workouts.</small></main><script>
const button=document.querySelector('#update'),status=document.querySelector('#status');
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Installing the latest version…';
 try{
  if('serviceWorker' in navigator){
   const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
   await registration.update();
   const worker=registration.installing||registration.waiting;
   if(worker){
    await new Promise((resolve,reject)=>{
     const timer=setTimeout(()=>reject(new Error('The update took too long. Please try again.')),20000);
     const check=()=>{if(['installed','activated'].includes(worker.state)){clearTimeout(timer);resolve();}else if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('The app update could not be installed. Please try again.'));}};
     worker.addEventListener('statechange',check);check();
    });
    if(worker.state!=='activated'){
     const activated=new Promise(resolve=>{const timer=setTimeout(resolve,8000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timer);resolve();},{once:true});});
     worker.postMessage({type:'FORM_ACTIVATE_UPDATE'});await activated;
    }
   }
   await navigator.serviceWorker.ready;
  }
  window.location.replace('./');
 }catch(error){status.textContent=error.message||'The update is unavailable. Check your connection and try again.';button.disabled=false;}
});
</script></body></html>
